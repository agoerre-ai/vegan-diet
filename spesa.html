<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a4d2e">
<title>Lista della spesa · 10–16 agosto</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:0 0 90px;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#f6f8f6;color:#1c231e}
  header{position:sticky;top:0;z-index:10;background:#1a4d2e;color:#fff;padding:14px 16px calc(12px + env(safe-area-inset-bottom,0px));
         box-shadow:0 2px 10px rgba(0,0,0,.15)}
  h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.2px}
  .sub{font-size:12.5px;opacity:.8;margin-top:3px}
  .bar{margin-top:10px;height:6px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
  .bar>span{display:block;height:100%;width:0;background:#8fd9a8;border-radius:99px;transition:width .25s}
  .wrap{max-width:720px;margin:0 auto;padding:14px}
  section{background:#fff;border-radius:14px;margin:0 0 12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)}
  h2{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#1a4d2e;
     padding:13px 15px 9px;background:#eef4ef}
  ul{list-style:none;margin:0;padding:0}
  li{border-top:1px solid #eef1ee}
  li:first-child{border-top:none}
  label{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;cursor:pointer;min-height:48px}
  input{appearance:none;-webkit-appearance:none;flex:0 0 22px;width:22px;height:22px;margin:1px 0 0;
        border:2px solid #b9c6bc;border-radius:6px;background:#fff;position:relative;transition:.15s}
  input:checked{background:#1a4d2e;border-color:#1a4d2e}
  input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
        border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
  .txt{flex:1}
  .name{font-weight:500}
  .qty{color:#5d6b61;font-size:14px}
  .hint{display:block;color:#a8611b;font-size:12.5px;margin-top:3px}
  input:checked ~ .txt .name,input:checked ~ .txt .qty{text-decoration:line-through;color:#9aa79e}
  input:checked ~ .txt .hint{color:#c3b19c}
  footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
         border-top:1px solid #e2e8e3;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
         display:flex;gap:10px;justify-content:space-between;align-items:center}
  .count{font-size:14px;color:#5d6b61}
  button{border:none;background:#eef4ef;color:#1a4d2e;font:inherit;font-size:14px;font-weight:600;
         padding:10px 16px;border-radius:10px;cursor:pointer}
  button:active{background:#dde8e0}
  .note{font-size:12.5px;color:#7a877f;padding:4px 4px 0;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Lista della spesa</h1>
  <div class="sub">Piano vegano · 10–16 agosto 2026 · 1 persona</div>
  <div class="bar"><span id="bar"></span></div>
</header>

<div class="wrap" id="app"></div>

<footer>
  <span class="count" id="count">—</span>
  <button id="reset">Azzera tutto</button>
</footer>

<script>
const DATA = [
 ["Legumi e derivati", [
   ["Ceci", "250 g secchi oppure 3 barattoli da 400 g"],
   ["Lenticchie", "250 g secche oppure 3 barattoli da 400 g"],
   ["Cannellini", "120 g secchi oppure 2 barattoli da 400 g"],
   ["Borlotti freschi da sgranare", "250 g"],
   ["Tofu", "300 g", "controlla che il coagulante sia solfato di calcio"],
   ["Tempeh", "230 g"],
   ["Yogurt di soia bianco", "1 vasetto da 125 g"],
   ["Bevanda di soia fortificata", "2 L, non zuccherata", "verifica calcio, B12 e vitamina D in etichetta"]
 ]],
 ["Cereali e farine", [
   ["Pasta integrale corta", "500 g"],
   ["Spaghetti integrali", "1 confezione"],
   ["Lasagne secche", "150 g"],
   ["Riso integrale", "200 g"],
   ["Farro perlato", "100 g"],
   ["Miglio", "100 g"],
   ["Pane integrale a lievitazione naturale", "1 filone da circa 500 g", "ne serve anche di raffermo"],
   ["Pangrattato integrale", "1 confezione piccola"],
   ["Farina", "100 g"],
   ["Amido di mais", "1 confezione piccola"]
 ]],
 ["Verdura di agosto", [
   ["Pomodori maturi", "1,4 kg"],
   ["Pomodorini", "350 g"],
   ["Passata di pomodoro", "1 bottiglia da 700 g"],
   ["Cetrioli", "4"],
   ["Peperoni", "4"],
   ["Melanzane", "4, circa 1 kg"],
   ["Zucchine", "400 g"],
   ["Fagiolini", "250 g"],
   ["Patate", "700 g"],
   ["Bietole", "450 g"],
   ["Rucola", "2 buste"],
   ["Insalata verde", "1 cespo"],
   ["Cavolo cappuccio", "un quarto, circa 200 g"],
   ["Mais", "1 barattolo piccolo"],
   ["Carote", "3"],
   ["Sedano", "2 coste"],
   ["Cipolle", "5"],
   ["Cipolla rossa", "1"],
   ["Aglio", "1 testa"],
   ["Zenzero fresco", "1 pezzetto"]
 ]],
 ["Erbe aromatiche", [
   ["Basilico", "2 mazzi"], ["Prezzemolo", ""], ["Menta", ""],
   ["Timo", ""], ["Rosmarino", ""], ["Erba cipollina", ""]
 ]],
 ["Frutta di agosto", [
   ["Pesche", "6"], ["Anguria", "1 fetta grande"], ["Melone", "1"],
   ["Fichi", "8"], ["Susine", "6"], ["Uva", "500 g"], ["Limoni", "4"]
 ]],
 ["Frutta secca e semi", [
   ["Mandorle", "150 g"], ["Noci", "100 g"], ["Semi di zucca", "50 g"],
   ["Semi di sesamo", "50 g"], ["Semi di lino", "100 g", "da macinare al momento"],
   ["Tahin", "1 vasetto", "da sesamo integrale: molto più calcio"]
 ]],
 ["Dispensa e condimenti", [
   ["Olio extravergine d'oliva", ""], ["Olive taggiasche", "1 vasetto"],
   ["Tamari o salsa di soia", ""], ["Aceto di vino rosso", ""], ["Aceto di mele", ""],
   ["Senape", ""], ["Sciroppo d'acero", ""], ["Sale iodato", ""],
   ["Paprika affumicata", ""], ["Cumino", ""], ["Peperoncino", ""],
   ["Noce moscata", ""], ["Alloro", ""], ["Origano", ""]
 ]],
 ["Da tenere d'occhio", [
   ["Integratore di vitamina B12", "25–100 µg al giorno oppure 2000 µg a settimana"],
   ["Acqua minerale ricca di calcio", "oltre 300 mg per litro", "la leva più semplice per arrivare a 1000 mg al giorno"]
 ]],
 ["Da preparare in anticipo", [
   ["Domenica sera", "lessare ceci, lenticchie e cannellini della settimana"],
   ["Venerdì sera", "mettere tofu e tempeh a marinare per Ferragosto"],
   ["Mercoledì", "tenere da parte il pane: serve raffermo per la panzanella"]
 ]]
];

const KEY = 'spesa-10-16-agosto-2026';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }

const app = document.getElementById('app');
DATA.forEach((sec, si) => {
  const s = document.createElement('section');
  const items = sec[1].map((it, ii) => {
    const id = si + '-' + ii;
    const hint = it[2] ? '<span class="hint">' + it[2] + '</span>' : '';
    const qty = it[1] ? '<div class="qty">' + it[1] + '</div>' : '';
    return '<li><label><input type="checkbox" data-id="' + id + '"' +
           (state[id] ? ' checked' : '') + '><span class="txt"><span class="name">' +
           it[0] + '</span>' + qty + hint + '</span></label></li>';
  }).join('');
  s.innerHTML = '<h2>' + sec[0] + '</h2><ul>' + items + '</ul>';
  app.appendChild(s);
});
const n = document.createElement('p');
n.className = 'note';
n.textContent = 'Le spunte restano salvate su questo dispositivo, anche chiudendo la pagina.';
app.appendChild(n);

const boxes = [...document.querySelectorAll('input[type=checkbox]')];
function sync() {
  const done = boxes.filter(b => b.checked).length;
  document.getElementById('count').textContent = done + ' di ' + boxes.length + ' presi';
  document.getElementById('bar').style.width = (boxes.length ? done / boxes.length * 100 : 0) + '%';
}
boxes.forEach(b => b.addEventListener('change', () => {
  state[b.dataset.id] = b.checked;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  sync();
}));
document.getElementById('reset').addEventListener('click', () => {
  boxes.forEach(b => b.checked = false);
  state = {};
  try { localStorage.removeItem(KEY); } catch (e) {}
  sync();
});
sync();
</script>
</body>
</html>
