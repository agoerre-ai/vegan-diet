/* ---------------- render spesa ---------------- */
const KEY = 'spesa-10-16-agosto-2026-v2';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }

const vs = document.getElementById('view-spesa');
SPESA.forEach((sec, si) => {
  const s = document.createElement('section');
  const items = sec[1].map((it, ii) => {
    const id = si + '-' + ii;
    const hint = it[2] ? '<span class="hint">' + it[2] + '</span>' : '';
    const qty = it[1] ? '<div class="qty">' + it[1] + '</div>' : '';
    return '<li><label><input type="checkbox" data-id="' + id + '"' +
           (state[id] ? ' checked' : '') + '><span class="txt"><span class="name">' +
           it[0] + '</span>' + qty + hint + '</span></label></li>';
  }).join('');
  s.innerHTML = '<h2>' + sec[0] + '</h2><ul>' + items + '</ul>';
  vs.appendChild(s);
});
const nEl = document.createElement('p');
nEl.className = 'note';
nEl.id = 'notaspesa';
nEl.textContent = 'Le spunte restano salvate su questo dispositivo, anche chiudendo la pagina.';
vs.appendChild(nEl);

/* ---------------- render ricette ---------------- */
const vr = document.getElementById('view-ricette');
R.forEach(dayArr => {
  const [giorno, frutta, pasti] = dayArr;
  const s = document.createElement('section');
  let html = '<div class="dayhead"><div class="dayname">' + giorno +
             '</div><div class="dayfruit">' + frutta + '</div></div>';
  pasti.forEach(p => {
    const [pasto, tit, tipo, mins, ingr, steps] = p;
    const ing = ingr.map(x => '<div class="ing"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>').join('');
    const st = steps.map(x => '<li>' + x + '</li>').join('');
    html += '<details><summary><span><span class="meal">' + pasto + '</span>' +
            '<div class="title">' + tit + '</div>' +
            '<div class="tag">' + tipo + ' · ' + mins + ' minuti</div></span>' +
            '<span class="chev">▼</span></summary>' +
            '<div class="rbody"><div class="rsec">Ingredienti</div>' + ing +
            '<div class="rsec" style="margin-top:14px">Preparazione</div>' +
            '<ol class="steps">' + st + '</ol></div></details>';
  });
  s.innerHTML = html;
  vr.appendChild(s);
});
const nr = document.createElement('p');
nr.className = 'note';
nr.textContent = 'Dosi per una persona. I legumi in barattolo vanno sempre sciacquati e sgocciolati.';
vr.appendChild(nr);

/* ---------------- interazione ---------------- */
const boxes = [...document.querySelectorAll('input[type=checkbox]')];
const chip = document.getElementById('sync');

function refresh() {
  const done = boxes.filter(b => b.checked).length;
  document.getElementById('count').textContent = done + ' di ' + boxes.length + ' presi';
  document.getElementById('bar').style.width = (boxes.length ? done / boxes.length * 100 : 0) + '%';
}
function applyState() {
  boxes.forEach(b => { b.checked = !!state[b.dataset.id]; });
  refresh();
}
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

/* ---- livello di sincronizzazione: Firestore se configurato, altrimenti locale ---- */
let pushRemote = null;          // funzione impostata solo se Firebase è attivo
let ignoraProssimoSnapshot = false;

function salva() {
  saveLocal();
  if (pushRemote) pushRemote();
}

boxes.forEach(b => b.addEventListener('change', () => {
  state[b.dataset.id] = b.checked;
  salva();
  refresh();
}));
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Azzero tutte le spunte?')) return;
  boxes.forEach(b => b.checked = false);
  state = {};
  salva();
  refresh();
});
refresh();

(async function collega() {
  if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === 'INCOLLA_QUI') {
    chip.textContent = 'solo locale';
    chip.className = 'sync off';
    return;
  }
  try {
    const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const { initializeApp } = await import(V + 'firebase-app.js');
    const { getDatabase, ref, set, onValue } = await import(V + 'firebase-database.js');
    const app = initializeApp(FIREBASE_CONFIG);

    if (USA_LOGIN_ANONIMO) {
      const { getAuth, signInAnonymously } = await import(V + 'firebase-auth.js');
      await signInAnonymously(getAuth(app));
    }

    const nodo = ref(getDatabase(app), PERCORSO);

    let timer = null;
    pushRemote = function () {
      chip.textContent = 'salvo…';
      chip.className = 'sync';
      clearTimeout(timer);
      timer = setTimeout(async () => {
        try {
          ignoraProssimoSnapshot = true;
          const presi = {};
          Object.keys(state).forEach(k => { if (state[k]) presi[k] = true; });
          await set(nodo, { items: presi, aggiornato: Date.now() });
          chip.textContent = 'sincronizzato';
          chip.className = 'sync';
        } catch (e) {
          ignoraProssimoSnapshot = false;
          chip.textContent = 'permessi negati';
          chip.className = 'sync err';
        }
      }, 500);
    };

    onValue(nodo, snap => {
      if (ignoraProssimoSnapshot) { ignoraProssimoSnapshot = false; return; }
      const dati = snap.val();
      state = (dati && dati.items) ? dati.items : {};
      saveLocal();
      applyState();
      chip.textContent = 'sincronizzato';
      chip.className = 'sync';
    }, () => {
      chip.textContent = 'offline';
      chip.className = 'sync err';
    });

    document.getElementById('notaspesa').textContent =
      'Le spunte sono salvate sul Realtime Database, ramo "dieta": le ritrovi da qualsiasi dispositivo.';
  } catch (e) {
    chip.textContent = 'solo locale';
    chip.className = 'sync off';
  }
})();

const tS = document.getElementById('tab-spesa'), tR = document.getElementById('tab-ricette');
function show(which) {
  const spesa = which === 'spesa';
  vs.classList.toggle('hidden', !spesa);
  vr.classList.toggle('hidden', spesa);
  tS.classList.toggle('on', spesa);
  tR.classList.toggle('on', !spesa);
  document.getElementById('foot').style.display = spesa ? 'flex' : 'none';
  document.getElementById('barwrap').style.display = spesa ? 'block' : 'none';
  document.body.style.paddingBottom = spesa ? '92px' : '24px';
  window.scrollTo(0, 0);
}
tS.addEventListener('click', () => show('spesa'));
tR.addEventListener('click', () => show('ricette'));
</script>
