<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a4d2e">
<title>Piano vegano</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:0 0 92px;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#f6f8f6;color:#1c231e}
  header{position:sticky;top:0;z-index:10;background:#1a4d2e;color:#fff;padding:13px 16px 0;
         box-shadow:0 2px 10px rgba(0,0,0,.15)}
  h1{margin:0;font-size:17px;font-weight:600}
  .sub{font-size:12.5px;opacity:.8;margin-top:3px}
  .bar{margin-top:9px;height:5px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
  .bar>span{display:block;height:100%;width:0;background:#8fd9a8;border-radius:99px;transition:width .25s}
  nav{display:flex;gap:22px;margin-top:9px;align-items:center}
  nav button{background:none;border:none;color:rgba(255,255,255,.65);font:inherit;font-size:14.5px;
             font-weight:600;padding:9px 0 10px;cursor:pointer;border-bottom:3px solid transparent}
  nav button.on{color:#fff;border-bottom-color:#8fd9a8}
  select{margin-left:auto;margin-bottom:7px;background:rgba(255,255,255,.15);color:#fff;border:none;
         font:inherit;font-size:13px;padding:5px 8px;border-radius:8px}
  select option{color:#1c231e}
  .sync{float:right;font-size:11.5px;font-weight:600;letter-spacing:.3px;padding:3px 9px;border-radius:99px;
        background:rgba(255,255,255,.16);color:rgba(255,255,255,.9);margin-top:1px}
  .sync.off{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
  .sync.err{background:#7a2f2f;color:#fff}
  .wrap{max-width:720px;margin:0 auto;padding:14px}
  section{background:#fff;border-radius:14px;margin:0 0 12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)}
  h2{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#1a4d2e;
     padding:13px 15px 9px;background:#eef4ef}
  ul{list-style:none;margin:0;padding:0}
  li{border-top:1px solid #eef1ee}
  li:first-child{border-top:none}
  label{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;cursor:pointer;min-height:48px}
  input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 22px;width:22px;height:22px;margin:1px 0 0;
        border:2px solid #b9c6bc;border-radius:6px;background:#fff;position:relative;transition:.15s}
  input:checked{background:#1a4d2e;border-color:#1a4d2e}
  input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
        border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
  .txt{flex:1}
  .name{font-weight:500}
  .qty{color:#5d6b61;font-size:14px}
  .hint{display:block;color:#a8611b;font-size:12.5px;margin-top:3px}
  input:checked ~ .txt .name,input:checked ~ .txt .qty{text-decoration:line-through;color:#9aa79e}
  input:checked ~ .txt .hint{color:#c3b19c}
  footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
         border-top:1px solid #e2e8e3;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
         display:flex;justify-content:space-between;align-items:center}
  .count{font-size:14px;color:#5d6b61}
  button.act{border:none;background:#eef4ef;color:#1a4d2e;font:inherit;font-size:14px;font-weight:600;
         padding:10px 16px;border-radius:10px;cursor:pointer}
  .note{font-size:12.5px;color:#7a877f;padding:4px 4px 14px;line-height:1.5}
  .dayhead{padding:13px 15px 9px;background:#eef4ef}
  .dayname{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#1a4d2e}
  .dayfruit{font-size:12.5px;color:#6f7d73;margin-top:2px}
  details{border-top:1px solid #eef1ee}
  summary{list-style:none;padding:13px 15px;cursor:pointer;display:flex;justify-content:space-between;
          align-items:flex-start;gap:10px;min-height:48px}
  summary::-webkit-details-marker{display:none}
  .meal{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#a8611b}
  .title{font-weight:600;margin-top:2px}
  .tag{font-size:12px;color:#7a877f;margin-top:3px}
  .chev{flex:0 0 auto;color:#b9c6bc;font-size:13px;margin-top:14px;transition:.2s}
  details[open] .chev{transform:rotate(180deg)}
  .rbody{padding:0 15px 16px}
  .rsec{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#1a4d2e;margin:6px 0 7px}
  .ing{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dotted #dfe6e0;font-size:14.5px}
  .ing b{font-weight:500}
  .ing span{color:#5d6b61;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .steps{margin:12px 0 0;padding-left:19px;font-size:14.5px;line-height:1.55;color:#2a352e}
  .steps li{border:none;margin-bottom:7px;padding:0}
  .vuoto{padding:40px 20px;text-align:center;color:#7a877f;font-size:14.5px;line-height:1.6}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <span class="sync off" id="sync">solo locale</span>
  <h1 id="titolo">Piano vegano</h1>
  <div class="sub" id="sottotitolo">caricamento…</div>
  <div class="bar" id="barwrap"><span id="bar"></span></div>
  <nav>
    <button id="tab-spesa" class="on">Spesa</button>
    <button id="tab-ricette">Ricette</button>
    <select id="scelta"></select>
  </nav>
</header>

<div class="wrap" id="view-spesa"></div>
<div class="wrap hidden" id="view-ricette"></div>

<footer id="foot">
  <span class="count" id="count">—</span>
  <button class="act" id="reset">Azzera tutto</button>
</footer>

<script>
/* =========================================================================
   App del piano alimentare. Qui dentro non c'è nessun menù: i dati di ogni
   settimana stanno in un file a parte, nella cartella del sito, con il nome
   settimana-AAAA-MM-GG.json dove la data è il lunedì di quella settimana.
   L'app cerca da sola la settimana in corso e, se non la trova, mostra
   l'ultima disponibile.
   ========================================================================= */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAWdt7k9RCANDIHbqMnus0_ftEyLGl-Anc",
  authDomain: "ago-workout.firebaseapp.com",
  databaseURL: "https://ago-workout-default-rtdb.firebaseio.com",
  projectId: "ago-workout",
  storageBucket: "ago-workout.firebasestorage.app",
  messagingSenderId: "456653056550",
  appId: "1:456653056550:web:51dbc7d9eaf13f4a2814e7"
};

// Le spunte vivono sotto questo ramo, separato da quello degli allenamenti.
const RAMO = "dieta/spesa";

// Metti true se le regole del Realtime Database richiedono un utente autenticato.
const USA_LOGIN_ANONIMO = false;

// Quante settimane passate cercare per riempire il menù a tendina.
const STORICO = 6;

/* ---------------- date ---------------- */
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio',
              'agosto','settembre','ottobre','novembre','dicembre'];
function lunediDi(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function iso(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function etichetta(d) {
  const f = new Date(d); f.setDate(f.getDate() + 6);
  const stessoMese = f.getMonth() === d.getMonth();
  return d.getDate() + (stessoMese ? '' : ' ' + MESI[d.getMonth()].slice(0, 3)) +
         '–' + f.getDate() + ' ' + MESI[f.getMonth()].slice(0, 3);
}

/* ---------------- stato ---------------- */
let dati = null, settimana = null, state = {}, boxes = [];
let pushRemote = null, staccaAscolto = null, ignoraProssimo = false;

const chip = document.getElementById('sync');
const vs = document.getElementById('view-spesa');
const vr = document.getElementById('view-ricette');
const scelta = document.getElementById('scelta');

/* ---------------- render ---------------- */
function render() {
  vs.innerHTML = ''; vr.innerHTML = '';

  (dati.spesa || []).forEach((sec, si) => {
    const s = document.createElement('section');
    const items = sec[1].map((it, ii) => {
      const id = si + '-' + ii;
      const hint = it[2] ? '<span class="hint">' + it[2] + '</span>' : '';
      const qty = it[1] ? '<div class="qty">' + it[1] + '</div>' : '';
      return '<li><label><input type="checkbox" data-id="' + id + '"><span class="txt">' +
             '<span class="name">' + it[0] + '</span>' + qty + hint + '</span></label></li>';
    }).join('');
    s.innerHTML = '<h2>' + sec[0] + '</h2><ul>' + items + '</ul>';
    vs.appendChild(s);
  });
  const n1 = document.createElement('p');
  n1.className = 'note'; n1.id = 'notaspesa';
  n1.textContent = 'Le spunte restano salvate su questo dispositivo.';
  vs.appendChild(n1);

  (dati.ricette || []).forEach(([giorno, frutta, pasti]) => {
    const s = document.createElement('section');
    let html = '<div class="dayhead"><div class="dayname">' + giorno +
               '</div><div class="dayfruit">' + frutta + '</div></div>';
    pasti.forEach(([pasto, tit, tipo, mins, ingr, steps]) => {
      const ing = ingr.map(x => '<div class="ing"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>').join('');
      const st = steps.map(x => '<li>' + x + '</li>').join('');
      html += '<details><summary><span><span class="meal">' + pasto + '</span>' +
              '<div class="title">' + tit + '</div>' +
              '<div class="tag">' + tipo + ' · ' + mins + ' minuti</div></span>' +
              '<span class="chev">▼</span></summary>' +
              '<div class="rbody"><div class="rsec">Ingredienti</div>' + ing +
              '<div class="rsec" style="margin-top:14px">Preparazione</div>' +
              '<ol class="steps">' + st + '</ol></div></details>';
    });
    s.innerHTML = html;
    vr.appendChild(s);
  });
  const n2 = document.createElement('p');
  n2.className = 'note';
  n2.textContent = 'Dosi per una persona. I legumi in barattolo vanno sempre sciacquati e sgocciolati.';
  vr.appendChild(n2);

  boxes = [...document.querySelectorAll('input[type=checkbox]')];
  boxes.forEach(b => b.addEventListener('change', () => {
    state[b.dataset.id] = b.checked;
    salva(); conta();
  }));
  applica();
}
function conta() {
  const done = boxes.filter(b => b.checked).length;
  document.getElementById('count').textContent = done + ' di ' + boxes.length + ' presi';
  document.getElementById('bar').style.width = (boxes.length ? done / boxes.length * 100 : 0) + '%';
}
function applica() {
  boxes.forEach(b => { b.checked = !!state[b.dataset.id]; });
  conta();
}
const chiaveLocale = () => 'spesa-' + settimana;
function salvaLocale() { try { localStorage.setItem(chiaveLocale(), JSON.stringify(state)); } catch (e) {} }
function salva() { salvaLocale(); if (pushRemote) pushRemote(); }

/* ---------------- firebase ---------------- */
let FB;
async function firebase() {
  if (FB !== undefined) return FB;
  try {
    const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const { initializeApp } = await import(V + 'firebase-app.js');
    const { getDatabase, ref, set, onValue } = await import(V + 'firebase-database.js');
    const app = initializeApp(FIREBASE_CONFIG);
    if (USA_LOGIN_ANONIMO) {
      const { getAuth, signInAnonymously } = await import(V + 'firebase-auth.js');
      await signInAnonymously(getAuth(app));
    }
    FB = { db: getDatabase(app), ref, set, onValue };
  } catch (e) { FB = null; }
  return FB;
}
async function collega() {
  if (staccaAscolto) { staccaAscolto(); staccaAscolto = null; }
  pushRemote = null;
  const fb = await firebase();
  if (!fb) { chip.textContent = 'solo locale'; chip.className = 'sync off'; return; }

  const nodo = fb.ref(fb.db, RAMO + '/' + settimana);
  let timer = null;
  pushRemote = function () {
    chip.textContent = 'salvo…'; chip.className = 'sync';
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try {
        ignoraProssimo = true;
        const presi = {};
        Object.keys(state).forEach(k => { if (state[k]) presi[k] = true; });
        await fb.set(nodo, { items: presi, aggiornato: Date.now() });
        chip.textContent = 'sincronizzato'; chip.className = 'sync';
      } catch (e) {
        ignoraProssimo = false;
        chip.textContent = 'permessi negati'; chip.className = 'sync err';
      }
    }, 500);
  };
  staccaAscolto = fb.onValue(nodo, snap => {
    if (ignoraProssimo) { ignoraProssimo = false; return; }
    const v = snap.val();
    state = (v && v.items) ? v.items : {};
    salvaLocale(); applica();
    chip.textContent = 'sincronizzato'; chip.className = 'sync';
  }, () => { chip.textContent = 'offline'; chip.className = 'sync err'; });

  const nota = document.getElementById('notaspesa');
  if (nota) nota.textContent = 'Le spunte sono salvate su Firebase, ramo "dieta": le ritrovi da qualsiasi dispositivo.';
}

/* ---------------- caricamento settimane ---------------- */
async function provaSettimana(chiave) {
  try {
    const r = await fetch('settimana-' + chiave + '.json', { cache: 'no-cache' });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}
async function apri(chiave) {
  const d = await provaSettimana(chiave);
  if (!d) return false;
  dati = d;
  settimana = chiave;
  document.getElementById('titolo').textContent = dati.titolo || 'Piano vegano';
  document.getElementById('sottotitolo').textContent = dati.sottotitolo || '';
  try { state = JSON.parse(localStorage.getItem('spesa-' + chiave) || '{}'); } catch (e) { state = {}; }
  render();
  collega();
  scelta.value = chiave;
  return true;
}
async function avvia() {
  const corrente = lunediDi(new Date());
  // dalla prossima settimana all'indietro, così trovo anche i piani già pronti
  const candidate = [];
  for (let i = 1; i >= -STORICO; i--) {
    const d = new Date(corrente); d.setDate(d.getDate() + i * 7);
    candidate.push(d);
  }
  const esiti = await Promise.all(candidate.map(d => provaSettimana(iso(d))));
  const trovate = candidate.filter((d, i) => esiti[i]);

  if (!trovate.length) {
    document.getElementById('sottotitolo').textContent = 'nessuna settimana caricata';
    vs.innerHTML = '<div class="vuoto">Non ho trovato nessun file <b>settimana-AAAA-MM-GG.json</b> ' +
                   'in questa cartella.<br>Caricane uno e ricarica la pagina.</div>';
    document.getElementById('foot').style.display = 'none';
    return;
  }
  scelta.innerHTML = trovate.map(d =>
    '<option value="' + iso(d) + '">' + etichetta(d) + '</option>').join('');

  // preferisco la settimana in corso; se manca, la più vicina nel futuro; altrimenti l'ultima passata
  const chiaviTrovate = trovate.map(iso);
  let scelto = chiaviTrovate.indexOf(iso(corrente));
  if (scelto < 0) {
    const futura = trovate.map((d, i) => [d, i]).filter(([d]) => d > corrente).pop();
    scelto = futura ? futura[1] : 0;
  }
  await apri(chiaviTrovate[scelto]);

  if (chiaviTrovate[scelto] !== iso(corrente)) {
    const nota = document.getElementById('notaspesa');
    if (nota) nota.textContent = trovate[scelto] > corrente
      ? 'Questa è la settimana che inizia lunedì: la sto mostrando perché quella in corso non è stata caricata.'
      : 'La settimana in corso non è ancora stata caricata: stai vedendo l’ultima disponibile.';
  }
}
scelta.addEventListener('change', () => apri(scelta.value));

/* ---------------- interazione ---------------- */
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Azzero tutte le spunte?')) return;
  boxes.forEach(b => b.checked = false);
  state = {};
  salva(); conta();
});
const tS = document.getElementById('tab-spesa'), tR = document.getElementById('tab-ricette');
function mostra(which) {
  const spesa = which === 'spesa';
  vs.classList.toggle('hidden', !spesa);
  vr.classList.toggle('hidden', spesa);
  tS.classList.toggle('on', spesa);
  tR.classList.toggle('on', !spesa);
  document.getElementById('foot').style.display = spesa ? 'flex' : 'none';
  document.getElementById('barwrap').style.display = spesa ? 'block' : 'none';
  document.body.style.paddingBottom = spesa ? '92px' : '24px';
  window.scrollTo(0, 0);
}
tS.addEventListener('click', () => mostra('spesa'));
tR.addEventListener('click', () => mostra('ricette'));

avvia();
</script>
</body>
</html>
